name: Validate mpackage file

on:
  pull_request:
    paths: 
      - 'packages/*.mpackage'
      - 'packages/*.zip'

jobs:
  check-mpackage-contents:
    runs-on: ubuntu-latest
    
    steps:
    - name: Skip if all files are deleted
      id: skip-if-deleted
      uses: actions/github-script@v7
      with:
        script: |
          const pr = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.payload.pull_request.number,
          });

          const allDeleted = pr.data.length > 0 && pr.data.every(file => file.status === 'removed');
          core.setOutput('skip', allDeleted);

    - name: Checkout repository
      if: steps.skip-if-deleted.outputs.skip != 'true'
      uses: actions/checkout@master

    - uses: leafo/gh-actions-lua@v10
      if: steps.skip-if-deleted.outputs.skip != 'true'
      with:
        luaVersion: "5.1.5"
      
    - name: Only one file per PR is allowed
      if: steps.skip-if-deleted.outputs.skip != 'true'
      id: check-file-count
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}      
      run: |
        # Statuses matter here, so this reads the API rather than `gh pr view`:
        # publishing a package under a new filename deletes the old one in the
        # same pull request, and that deletion must not count towards the limit.
        PATHS=$(gh api --paginate \
          "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
          --jq '.[] | select(.status != "removed") | .filename')

        PACKAGE_RE='^packages/[^/]+\.(mpackage|zip)$'
        FILE=$(echo "$PATHS" | grep -E "$PACKAGE_RE" || true)

        # check only 1 package file has been uploaded per PR
        COUNT=$(echo "$FILE" | grep -c . || true)
        if [ "$COUNT" -gt 1 ]; then
          echo "Error: Only one package file per pull request please."
          exit 1
        elif [ "$COUNT" -eq 0 ]; then
          echo "Error: no package file found in this pull request."
          exit 1
        fi

        # The name travels to later steps through $GITHUB_OUTPUT and is handled as
        # a shell word at the other end, so keep it to characters that mean nothing
        # to a shell rather than trusting every one of those steps to quote it.
        if printf '%s' "$FILE" | LC_ALL=C grep -q "[^A-Za-z0-9 ._(),'/-]"; then
          echo "Error: this package's filename contains characters that are not allowed:"
          echo "  $FILE"
          echo "Please rename it using letters, digits, spaces and . _ - ( ) , ' only."
          exit 1
        fi

        # A trusted publish also records where the archive came from, pinned to
        # its digest (see TRUSTED-PUBLISHING.md), so the package's own record
        # under provenance/ may ride along - that one file and no other. Named
        # exactly rather than matched by shape: "any provenance/*.json" let a
        # pull request carry records for packages it does not touch.
        ALLOWED_PROVENANCE="provenance/$(basename "$FILE").json"
        OTHER=$(echo "$PATHS" | grep -vE "$PACKAGE_RE" | grep -vxF "$ALLOWED_PROVENANCE" || true)
        if [ -n "$OTHER" ]; then
          echo "Error: this pull request changes files that are not a package:"
          echo "$OTHER" | sed 's/^/  /'
          echo "The only file that may accompany one is $ALLOWED_PROVENANCE."
          exit 1
        fi

        echo "Pass: just one file uploaded."

        echo "FILE=$FILE" >> $GITHUB_OUTPUT
      
    - name: Unzip the mpackage and check config.lua exists
      if: steps.skip-if-deleted.outputs.skip != 'true'
      id: unzip-mpackage-file
      env:
        FILE: ${{ steps.check-file-count.outputs.FILE }}
      run: |
        echo "${FILE}"

        # unzip the mpackage
        unzip -q -o "${FILE}" -d unzipped_package
        ls -al unzipped_package

        #only valid if it has a config.lua
        if [ -f "unzipped_package/config.lua" ]; then
          echo "Pass: config.lua is present"
        else
          echo "Error: config.lua is missing."
          exit 1
        fi

    - name: Check config.lua contains all required information
      if: steps.skip-if-deleted.outputs.skip != 'true'
      id: check-config-lua
      run: |
        # grep for some vital details
        if grep -q "mpackage =" unzipped_package/config.lua; then
          echo "Pass: has a valid mpackage name"
        else
          echo "Error: not a valid mpackage file"
          exit 1
        fi

        if grep -q "title =" unzipped_package/config.lua; then
          echo "Pass: has a valid title"
        else
          echo "Error: does not contain a valid title"
          exit 1
        fi
        
        if grep -q "version =" unzipped_package/config.lua; then
          echo "Pass: config.lua contains a version number"
        else
          echo "Error: does not contain a version number"
          exit 1
        fi   

        if grep -q "created =" unzipped_package/config.lua; then
          echo "Pass: has a valid creation date"
        else
          echo "Error: not a valid creation date"
          exit 1
        fi        

        if grep -q "author =" unzipped_package/config.lua; then         
          echo "Pass: has a valid author name"
        else
          echo "Error: does not contain a valid author name"
          exit 1
        fi  

        if grep -q "description =" unzipped_package/config.lua; then
          echo "Pass: has a valid description"      
        else
          echo "Error: does not contain a valid description"
          exit 1
        fi

    - name: Check for malicious content
      if: steps.skip-if-deleted.outputs.skip != 'true'
      id: check-malicious-content
      env:
        FILE: ${{ steps.check-file-count.outputs.FILE }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        # Nothing a package legitimately does needs these, so they are looked at by
        # hand wherever they turn up, however long they have been in the package.
        PATTERN_STRICT='os\.exec|lfs\.rmdir'
        # A standard Mudlet event: registering a handler for it is how a mapper tracks
        # movement, and it is also how a package would read everything you type. Worth
        # a look when a pull request touches one, not worth freezing every package that
        # has always had one - that is what made them impossible to update (#755).
        PATTERN_CONTEXTUAL='sysDataSendRequest'

        if grep -a -n -R -E "$PATTERN_STRICT" unzipped_package/; then
          echo "::error:: questionable functions used, please validate manually"
          exit 1
        fi

        # Unpack the version of this package that is already on the base branch, so the
        # two can be compared file by file. Whatever it matched there was looked at when
        # it was merged; only what this pull request changes needs another manual look.
        if git fetch --no-tags --depth=1 origin "$BASE_SHA" >/dev/null 2>&1 \
           && git cat-file -e "$BASE_SHA:$FILE" 2>/dev/null \
           && git show "$BASE_SHA:$FILE" > base_package.zip \
           && unzip -q -o base_package.zip -d unzipped_base_package; then
          echo "Comparing against ${FILE} as of ${BASE_SHA}."
        else
          # A new package, or a previous version that could not be read: check it whole.
          # unzip reports a warning with a non-zero status once it has already unpacked
          # everything, so drop what it left rather than half-comparing against it.
          rm -rf unzipped_base_package
          echo "No previous version of ${FILE} to compare against, checking the whole package."
        fi

        : > findings.txt
        while IFS= read -r new_file; do
          base_file="unzipped_base_package/${new_file#unzipped_package/}"
          if [ -f "$base_file" ]; then
            # Only report a match that this pull request touched: with 20 lines of context
            # a diff hunk covers the handler or function a match sits in, so a match shows
            # up in one when it is added, when it moves, and when the code around it is
            # rewritten. Removed lines are dropped - taking a match out needs no review -
            # and so are the two header lines, which carry a path rather than any code.
            changed=$(diff -a -U20 "$base_file" "$new_file") && rc=0 || rc=$?
            if [ "$rc" -ge 2 ]; then
              # diff says 0 for same and 1 for differs. Anything above that means it could
              # not do the comparison, which must not pass for a file with nothing in it.
              echo "::error:: could not compare ${new_file#unzipped_package/} against the version in ${FILE}"
              exit 1
            fi
            hits=$(printf '%s\n' "$changed" | tail -n +3 | grep -v '^-' | grep -a -E "$PATTERN_CONTEXTUAL") || true
          else
            hits=$(grep -a -E "$PATTERN_CONTEXTUAL" "$new_file") || true
          fi
          if [ -n "$hits" ]; then
            printf '%s:\n%s\n' "${new_file#unzipped_package/}" "$hits" >> findings.txt
          fi
        done < <(find unzipped_package -type f)

        if [ -s findings.txt ]; then
          echo "Added or changed by this pull request:"
          cat findings.txt
          echo "::error:: questionable events used, please validate manually"
          exit 1
        fi

        echo "Pass: security checks"

    - name: Extract package name and author, check for duplicates
      if: steps.skip-if-deleted.outputs.skip != 'true'
      id: check-package-name
      env:
        FILE: ${{ steps.check-file-count.outputs.FILE }}
      run: |
        # Extract the package name and author from config.lua
        PACKAGE_NAME=$(lua -e "dofile('unzipped_package/config.lua'); print(_G['mpackage'])")
        PACKAGE_AUTHOR=$(lua -e "dofile('unzipped_package/config.lua'); print(_G['author'])")
        echo "Package name: $PACKAGE_NAME"
        echo "Package author: $PACKAGE_AUTHOR"
        
        # Get current PR file name
        CURRENT_FILE="${FILE}"
        CURRENT_BASENAME=$(basename "${CURRENT_FILE}")
        
        # Create temporary directory for checking other packages
        mkdir temp_check
        
        # Extract config.lua from all other packages, excluding current one if it exists
        for package in packages/*.{mpackage,zip}; do
          if [ "$package" != "${CURRENT_FILE}" ]; then
            BASENAME=$(basename "$package")
            unzip -q -o "$package" config.lua -d "temp_check/${BASENAME}"
          fi
        done
        
        # Check for case-insensitive duplicates with different authors
        for config in temp_check/**/config.lua; do
          if [ -f "$config" ]; then
            OTHER_NAME=$(lua -e "dofile('$config'); print(_G['mpackage'])")
            OTHER_AUTHOR=$(lua -e "dofile('$config'); print(_G['author'])")
            if [ "${PACKAGE_NAME,,}" = "${OTHER_NAME,,}" ] && [ "${PACKAGE_AUTHOR,,}" != "${OTHER_AUTHOR,,}" ]; then
              echo "Error: Package name '$PACKAGE_NAME' by '$PACKAGE_AUTHOR' conflicts with existing package '$OTHER_NAME' by '$OTHER_AUTHOR'"
              exit 1
            fi
          fi
        done
        
        echo "Pass: No conflicting package names found"
        echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_OUTPUT
        echo "PACKAGE_AUTHOR=$PACKAGE_AUTHOR" >> $GITHUB_OUTPUT

